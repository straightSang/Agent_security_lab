[project]
name = "ai-agent-security-lab"
version = "2.0.0"
description = "AI Agent Security Lab — 단일 트리 하니스"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# F841(미사용 대입), F401(미사용 import), E731 등 평가보고서가 지적한 유형을 잡는다.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
